# Environment for matched-case concatenation.
# For raw-to-signature analysis, use visium/06_downstream/install_raw_signature_environment.sh.
name: seed-visium-concat
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.12
  - scanpy=1.11.1
  - anndata=0.10.5.post1
  - numpy=1.24.4
  - scipy=1.9.1
  - pandas=2.2.3
  - scikit-learn=1.5.1
  - numba=0.60.0
  - llvmlite=0.43.0
  - pynndescent=0.5.13
  - umap-learn=0.5.6
  - bbknn=1.6.0
  - leidenalg=0.10.2
  - python-igraph=0.11.5
  - louvain=0.8.2
  - h5py=3.11.0
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - joblib=1.4.2
  - threadpoolctl=3.5.0
  - networkx=3.3
  - natsort=8.4.0
  - packaging=24.2
  - patsy=0.5.6
  - statsmodels=0.14.2
  - zarr=2.18.2
  - python-annoy=1.17.3
