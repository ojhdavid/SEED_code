# Environment for standalone Visium integration.
# For raw-to-signature analysis, use visium/06_downstream/install_raw_signature_environment.sh.
name: seed-visium
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10.20
  - scanpy=1.10.4
  - anndata=0.10.9
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.3
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - scikit-learn=1.7.2
  - h5py=3.13.0
  - pyyaml=6.0.3
  - bbknn=1.6.0
  - umap-learn=0.5.12
  - leidenalg=0.10.2
  - louvain=0.8.2
